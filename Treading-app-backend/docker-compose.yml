version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: trading-db
    environment:
      POSTGRES_DB: trading
      POSTGRES_USER: trading_admin
      POSTGRES_PASSWORD: Trading@123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading_admin -d trading"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: trading-app
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/trading
      DB_USERNAME: trading_admin
      DB_PASSWORD: Trading@123
      JWT_SECRET: fdsfsdfdsfdsjlfsdfjsdkfjsdfjdsklfjekjrjwerjejfdsfjdsofudsfsdf
      SERVER_PORT: 8080
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

volumes:
  pgdata:
